<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" style="display:none">
<!--
  BARE KYLLING – FIGURER
  Én sprite med alle tegnede figurer. Brukes slik:
    <svg class="figure" aria-hidden="true" focusable="false">  (størrelse via figure-klasser i CSS)
      <use href="images/figurer.svg#kylling-loper"></use>
    </svg>
  Alle symboler arver farge fra CSS (currentColor). Strek-stilen er den samme
  som logoen: runde ender, ingen fyll utenom øyeprikken.

  Grupper:
    kylling-*   maskot, viewBox 0 0 120 120, strek 5
    doodle-*    krydder/ingredienser, viewBox 0 0 64 64, strek 4
    ikon-*      linjeikoner, viewBox 0 0 32 32, strek 2.25
-->

<!-- ================= MASKOT ================= -->

<!-- Løper mot høyre: beina i steg, fartsstreker bak halen -->
<symbol id="kylling-loper" viewBox="0 0 120 120" fill="none" stroke="currentColor" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
  <g transform="translate(14 8)">
    <path d="M63.5 4c2.5-4 7.5-3 9 1.5 2.5-4 8-3 8.5 1.5 4-1.5 8 1.5 6.5 6 3 2.5 4.5 6 4.5 9.5l7.5 3.5-9 4.5"/>
    <path d="M90 30.5c-1 4.5-1.5 8-1.5 12.5v15.5C88.5 73.5 77 85 62.5 85h-16C32 85 20.5 73.5 20.5 59c0-1 0-2 .2-3"/>
    <path d="M21.5 61.5L2 56.5l19-12L1.5 29l25 4.5c12.5 2 24-.5 32-6.5 3.5-2.5 5.5-6.5 5.5-11"/>
    <!-- bakre bein sparker bakover, fremre bein strekker fram -->
    <path d="M42 84.5l-9 11-9-1M63 84.5l7 9 10 1"/>
    <circle cx="75.5" cy="18.5" r="2.7" fill="currentColor" stroke="none"/>
  </g>
  <!-- fartsstreker -->
  <path d="M3 58h8M1 70h10M5 82h6"/>
</symbol>

<!-- Titter opp over en kant: hode og vingetupper -->
<symbol id="kylling-titter" viewBox="0 0 120 120" fill="none" stroke="currentColor" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
  <!-- kanten -->
  <path d="M2 78h116"/>
  <g transform="translate(-4 36)">
    <path d="M63.5 4c2.5-4 7.5-3 9 1.5 2.5-4 8-3 8.5 1.5 4-1.5 8 1.5 6.5 6 3 2.5 4.5 6 4.5 9.5l7.5 3.5-9 4.5"/>
    <!-- bryst ned til kanten -->
    <path d="M90 30.5c-1 4-1.4 7.5-1.5 11.5"/>
    <!-- rygg/nakke ned til kanten -->
    <path d="M63.5 4c-5 9-8 20-8 38"/>
    <circle cx="75.5" cy="18.5" r="2.7" fill="currentColor" stroke="none"/>
  </g>
  <!-- vingetupper som holder i kanten -->
  <path d="M60 78c0-7 9-7 9 0M76 78c0-7 9-7 9 0"/>
</symbol>

<!-- Stikker hodet opp av en sekk -->
<symbol id="kylling-i-sekk" viewBox="0 0 120 120" fill="none" stroke="currentColor" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
