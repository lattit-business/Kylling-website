    <path d="M12 6L9 2M6 16l-5-1"/>
  </g>
</symbol>

<!-- Sover: ligger på bakken, lukket øye, z-er -->
<symbol id="kylling-sover" viewBox="0 0 120 120" fill="none" stroke="currentColor" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
