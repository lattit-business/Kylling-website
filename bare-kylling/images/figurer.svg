    <path d="M72 18c1.5 2.5 5.5 2.5 7 0"/>
  </g>
  <!-- bakken -->
  <path d="M14 111h92"/>
  <!-- z z z -->
  <path d="M96 30h7l-7 8h7M104 12h10l-10 12h10" stroke-width="4"/>
</symbol>

