    <path d="M21.5 61.5L2 56.5l19-12L1.5 29l25 4.5c12.5 2 24-.5 32-6.5 3.5-2.5 5.5-6.5 5.5-11"/>
    <path d="M39.5 84.5V97h-8.5M60.5 84.5V97h8.5"/>
    <circle cx="75.5" cy="18.5" r="2.7" fill="currentColor" stroke="none"/>
